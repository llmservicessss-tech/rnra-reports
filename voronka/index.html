<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>RENERA · закрытый отчёт</title>
<style>
  :root {
    color-scheme: light;
    --color-bg: #f6f7f9;
    --color-panel: #ffffff;
    --color-fg: #1d2129;
    --color-fg-muted: #626a77;
    --color-border-line: #d7dbe2;
    --color-accent: #3b78c2;
    --color-bad: #c23b32;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --color-bg: #15181d;
      --color-panel: #1d2128;
      --color-fg: #e7e9ee;
      --color-fg-muted: #9aa2b0;
      --color-border-line: #3a404b;
      --color-accent: #6b9fdc;
      --color-bad: #f07167;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--color-bg); color: var(--color-fg); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .box { width: 100%; max-width: 360px; background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 10px; padding: 28px 24px; }
  .stamp { margin: 0 0 6px; font-size: 12px; color: var(--color-fg-muted); letter-spacing: .04em; text-transform: uppercase; }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
  .muted { margin: 0 0 18px; color: var(--color-fg-muted); }
  input[type=password] { width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: 6px; }
  input[type=password]:focus { outline: 2px solid var(--color-accent); outline-offset: 1px; }
  .remember { display: flex; gap: 8px; align-items: center; margin: 12px 0 16px; color: var(--color-fg-muted); font-size: 14px; }
  button { width: 100%; padding: 10px 12px; font: inherit; font-weight: 600; color: #fff; background: var(--color-accent); border: 0; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .msg { min-height: 1.4em; margin: 12px 0 0; color: var(--color-bad); font-size: 14px; }
</style>
</head>
<body>
<main class="box">
  <p class="stamp">RENERA · аналитика</p>
  <h1>Закрытый отчёт</h1>
  <p class="muted">Введите пароль, чтобы открыть дашборд.</p>
  <form id="f">
    <input type="text" name="username" value="renera" autocomplete="username" hidden>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" aria-label="Пароль" required autofocus>
    <label class="remember"><input id="rm" type="checkbox"> Запомнить на этом устройстве</label>
    <button id="go" type="submit">Открыть</button>
    <p id="msg" class="msg" role="alert"></p>
  </form>
</main>

(() => {
  const STORE = 'rnra-key:' + location.pathname;
  const $ = (id) => document.getElementById(id);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const store = {
    get: () => { try { return localStorage.getItem(STORE); } catch (e) { return null; } },
    set: (v) => { try { localStorage.setItem(STORE, v); } catch (e) {} },
    del: () => { try { localStorage.removeItem(STORE); } catch (e) {} },
  };

  const derive = async (pw) => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.it }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  };
  // Неверный ключ — исключение от AES-GCM (не сошёлся тег), страница не меняется.
  const open = async (key) => {
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)));
    document.open();
    document.write(html);
    document.close();
  };

  if (!window.crypto || !crypto.subtle) {
    $('msg').textContent = 'Браузер не может расшифровать страницу. Откройте её по адресу https://';
    $('go').disabled = true;
    return;
  }

  // Ключ, сохранённый с «Запомнить», подходит только к этой версии отчёта: после обновления спросим пароль снова.
  // Открываем после загрузки: пока страница входа грузится, подмена документа не срабатывает.
  const saved = store.get();
  if (saved) {
    const auto = () => crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt']).then(open).catch(store.del);
    if (document.readyState === 'complete') auto();
    else window.addEventListener('load', auto, { once: true });
  }

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('go').disabled = true;
    $('msg').textContent = '';
    try {
      const key = await derive($('pw').value);
      if ($('rm').checked) store.set(toB64(await crypto.subtle.exportKey('raw', key)));
      await open(key);
    } catch (err) {
      store.del();
      $('msg').textContent = 'Неверный пароль';
      $('go').disabled = false;
      $('pw').select();
    }
  });
})();
</script>
